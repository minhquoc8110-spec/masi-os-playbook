name: slides-canary-build

on:
  pull_request:
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'open-slide.config.ts'
      - 'slides/**'
      - 'docs/SLIDES_CANARY_QA_CHECKLIST.md'
      - '.github/workflows/slides-canary-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build open-slide deck
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: masi-os-open-slide-canary-dist
          path: dist
